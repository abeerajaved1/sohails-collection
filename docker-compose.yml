services:
  store:
    build: .
    image: sohails-collection
    container_name: sohails-collection
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Required. Put it in a .env file next to this file (copy .env.example).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      # Set to 1 only when running behind Nginx/Caddy/Render/etc. (HTTPS proxy)
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - store-data:/data

volumes:
  store-data:
